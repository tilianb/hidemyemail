<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description">
  <title id="title">HideMyEmail architecture</title>
  <desc id="description">Mail enters through AWS SES, is stored in S3, routed by SNS to a Cloudflare Worker, then sent through SES to a verified inbox. Web, iOS, Android, and extension clients use the Worker API, which stores encrypted state in D1.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0a1728"/>
    </linearGradient>
    <linearGradient id="workerFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#281f48"/>
      <stop offset="1" stop-color="#171f42"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020817" flood-opacity=".45"/>
    </filter>
    <marker id="mailArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 9 4.5 0 9Z" fill="#5eead4"/>
    </marker>
    <marker id="apiArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 9 4.5 0 9Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title { fill:#f8fafc; font:700 28px system-ui,-apple-system,sans-serif; }
      .subtitle { fill:#7894aa; font:14px system-ui,-apple-system,sans-serif; }
      .lane { font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:1.4px; }
      .node-title { fill:#e7f8ff; font:700 15px system-ui,-apple-system,sans-serif; text-anchor:middle; }
      .node-detail { fill:#8fa8bb; font:13px system-ui,-apple-system,sans-serif; text-anchor:middle; }
      .edge-label { fill:#9ab1c2; font:12px ui-monospace,SFMono-Regular,Consolas,monospace; text-anchor:middle; }
      .client-label { fill:#dff4ff; font:650 13px system-ui,-apple-system,sans-serif; text-anchor:middle; }
    </style>
  </defs>

  <rect width="1200" height="660" rx="24" fill="url(#background)"/>
  <path d="M0 0H1200V5H0Z" fill="#5eead4" opacity=".85"/>

  <text class="title" x="42" y="54">How HideMyEmail works</text>
  <text class="subtitle" x="42" y="80">Serverless mail routing, private aliases, and one encrypted control plane</text>

  <text class="lane" x="42" y="130" fill="#5eead4">MAIL PLANE</text>
  <line x1="42" y1="148" x2="1158" y2="148" stroke="#163249"/>

  <g filter="url(#shadow)">
    <g>
      <rect x="42" y="180" width="142" height="96" rx="14" fill="#0b2033" stroke="#4299e1" stroke-width="1.5"/>
      <circle cx="113" cy="210" r="12" fill="#4299e1" opacity=".2"/>
      <path d="M106 210h14m-7-7v14" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round"/>
      <text class="node-title" x="113" y="241">Internet sender</text>
      <text class="node-detail" x="113" y="259">Message to an alias</text>
    </g>
    <g>
      <rect x="226" y="180" width="142" height="96" rx="14" fill="#261d19" stroke="#ed8936" stroke-width="1.5"/>
      <path d="M286 203h22v16h-22zM286 204l11 9 11-9" fill="none" stroke="#f6ad55" stroke-width="1.8" stroke-linejoin="round"/>
      <text class="node-title" x="297" y="241">AWS SES</text>
      <text class="node-detail" x="297" y="259">Receipt rule</text>
    </g>
    <g>
      <rect x="410" y="180" width="142" height="96" rx="14" fill="#0b2033" stroke="#4299e1" stroke-width="1.5"/>
      <path d="M469 204c0-5 24-5 24 0v14c0 5-24 5-24 0zm0 0c0 5 24 5 24 0m-24 7c0 5 24 5 24 0" fill="none" stroke="#7dd3fc" stroke-width="1.7"/>
      <text class="node-title" x="481" y="241">Amazon S3</text>
      <text class="node-detail" x="481" y="259">Bounded raw MIME</text>
    </g>
    <g>
      <rect x="594" y="172" width="166" height="112" rx="16" fill="url(#workerFill)" stroke="#9f7aea" stroke-width="1.8"/>
      <path d="M669 199h16l8 14-8 14h-16l-8-14z" fill="none" stroke="#c4b5fd" stroke-width="1.8"/>
      <circle cx="677" cy="213" r="3" fill="#c4b5fd"/>
      <text class="node-title" x="677" y="247">Cloudflare Worker</text>
      <text class="node-detail" x="677" y="266">Verify · route · rewrite</text>
    </g>
    <g>
      <rect x="802" y="180" width="142" height="96" rx="14" fill="#261d19" stroke="#ed8936" stroke-width="1.5"/>
      <path d="M862 203h22v16h-22zM862 204l11 9 11-9" fill="none" stroke="#f6ad55" stroke-width="1.8" stroke-linejoin="round"/>
      <text class="node-title" x="873" y="241">AWS SES</text>
      <text class="node-detail" x="873" y="259">SendRawEmail</text>
    </g>
    <g>
      <rect x="986" y="180" width="172" height="96" rx="14" fill="#10271f" stroke="#48bb78" stroke-width="1.5"/>
      <path d="M1061 203h22v16h-22zM1061 204l11 9 11-9" fill="none" stroke="#86efac" stroke-width="1.8" stroke-linejoin="round"/>
      <text class="node-title" x="1072" y="241">Verified inbox</text>
      <text class="node-detail" x="1072" y="259">Receive and reply</text>
    </g>
  </g>

  <g fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#mailArrow)">
    <path d="M184 228H226"/>
    <path d="M368 228H410"/>
    <path d="M552 228H594"/>
    <path d="M760 228H802"/>
    <path d="M944 228H986"/>
  </g>
  <text class="edge-label" x="573" y="216">SNS</text>

  <g fill="none" stroke="#315f69" stroke-width="1.6" stroke-dasharray="6 6">
    <path d="M1072 276V306Q1072 330 1048 330H875"/>
    <path d="M493 330H321Q297 330 297 306V278" marker-end="url(#mailArrow)"/>
  </g>

  <text class="lane" x="42" y="390" fill="#7dd3fc">CONTROL PLANE</text>
  <path d="M42 408H726M764 408H1158" stroke="#163249"/>

  <g filter="url(#shadow)">
    <g fill="#0b2033" stroke="#315f80" stroke-width="1.4">
      <rect x="42" y="446" width="112" height="68" rx="13"/>
      <rect x="170" y="446" width="112" height="68" rx="13"/>
      <rect x="298" y="446" width="112" height="68" rx="13"/>
      <rect x="426" y="446" width="140" height="68" rx="13"/>
    </g>
    <text class="client-label" x="98" y="486">Web</text>
    <text class="client-label" x="226" y="486">iOS</text>
    <text class="client-label" x="354" y="486">Android</text>
    <text class="client-label" x="496" y="486">Extension</text>

    <rect x="650" y="438" width="190" height="84" rx="15" fill="url(#workerFill)" stroke="#9f7aea" stroke-width="1.7"/>
    <text class="node-title" x="745" y="475">Worker API</text>
    <text class="node-detail" x="745" y="496">Auth · aliases · rules</text>

    <rect x="942" y="438" width="216" height="84" rx="15" fill="#0b2033" stroke="#4299e1" stroke-width="1.7"/>
    <text class="node-title" x="1050" y="475">Cloudflare D1</text>
    <text class="node-detail" x="1050" y="496">Encrypted state · delivery fences</text>
  </g>

  <g fill="none" stroke="#7dd3fc" stroke-width="1.8">
    <path d="M98 514V546"/>
    <path d="M226 514V546"/>
    <path d="M354 514V546"/>
    <path d="M496 514V546"/>
    <path d="M98 546H606Q620 546 620 532V494Q620 480 634 480H650" marker-end="url(#apiArrow)"/>
    <path d="M840 480H942" marker-end="url(#apiArrow)"/>
  </g>
  <path d="M745 438V365Q745 350 730 350H692Q677 350 677 284" fill="none" stroke="#586a9a" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#apiArrow)"/>
  <text class="edge-label" x="887" y="467">queries</text>

  <rect x="505" y="313" width="358" height="25" rx="12" fill="#081421"/>
  <text class="edge-label" x="684" y="329">replies return through the reverse alias</text>

  <g transform="translate(42 570)">
    <rect width="1116" height="50" rx="12" fill="#0b1d2e" stroke="#163249"/>
    <circle cx="28" cy="25" r="7" fill="#48bb78"/>
    <text x="47" y="30" fill="#a9bfd0" font-family="system-ui,-apple-system,sans-serif" font-size="13">One Worker serves the API, dashboard assets, mail webhooks, scheduled retention, and Docker self-hosting through Miniflare.</text>
  </g>
</svg>
