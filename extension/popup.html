<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HideMyEmail</title><link rel="stylesheet" href="/src/popup.css"></head>
  <body>
    <main>
      <header><span class="mark" aria-hidden="true">H</span><div><h1>HideMyEmail</h1><p id="server-label">Private aliases, one click away.</p></div><button id="settings" class="text-button" type="button" hidden>Change</button></header>
      <section id="setup" aria-labelledby="setup-title">
        <h2 id="setup-title">Connect your deployment</h2>
        <form id="setup-form">
          <label>Server URL<input id="server" type="url" required placeholder="https://mail.example.com" autocomplete="url" spellcheck="false" disabled></label>
          <label>Dedicated API key<input id="key" type="password" required placeholder="hme_…" autocomplete="off" spellcheck="false" disabled></label>
          <button id="connect" class="primary" type="submit" disabled>Connect securely</button>
        </form>
        <p class="security">Stored only in Chrome's local extension storage on this device. Create and revoke this key in <strong>Settings → API Keys</strong>.</p>
      </section>
      <section id="generator" hidden aria-labelledby="generator-title">
        <h2 id="generator-title">New alias</h2>
        <label>Domain<select id="domain" disabled></select></label>
        <button id="generate" class="primary" type="button" disabled>Generate alias</button>
        <div id="result" class="result" hidden><span id="alias"></span><button id="copy" type="button">Copy</button></div>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
