name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - 'dashboard/**'
      - 'extension/**'
      - '.github/workflows/ci.yml'
      - '!**.md'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'worker/**'
      - 'dashboard/**'
      - 'extension/**'
      - '.github/workflows/ci.yml'
      - '!**.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  worker-checks:
    name: Worker Checks
    runs-on: namespace-profile-github-light
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout code
        uses: namespacelabs/nscloud-checkout-action@445c25d7009680597d73eb03c4e1cd5be522ed73 # v9

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22 # Matching the node types version in worker package.json
          package-manager-cache: false

      - name: Set up Namespace npm cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm run test

  dashboard-checks:
    name: Dashboard Checks
    runs-on: namespace-profile-github-light
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout code
        uses: namespacelabs/nscloud-checkout-action@445c25d7009680597d73eb03c4e1cd5be522ed73 # v9

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Namespace npm cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and Type Check
        run: npm run build

  extension-checks:
    name: Extension Checks
    runs-on: namespace-profile-github-light
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Checkout code
        uses: namespacelabs/nscloud-checkout-action@445c25d7009680597d73eb03c4e1cd5be522ed73 # v9
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Set up Namespace npm cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build extension
        run: npm run build
