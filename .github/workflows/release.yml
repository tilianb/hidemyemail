name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout protected history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a stable release tag from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must point to a commit on main." >&2
            exit 1
          }
      - name: Validate versions, Android versionCode, and release notes
        run: |
          node worker/scripts/validate-release.mjs \
            --tag="$GITHUB_REF_NAME" \
            --repository="$GITHUB_REPOSITORY" \
            --notes-output=release-notes.md
      - name: Validate exact remote tag
        run: |
          remote_ref="refs/remotes/origin/release-tag"
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:$remote_ref"
          remote_tag_commit="$(git rev-parse "$remote_ref^{commit}")"
          if [ "$remote_tag_commit" != "$GITHUB_SHA" ]; then
            echo "Remote tag $GITHUB_REF_NAME moved from $GITHUB_SHA to $remote_tag_commit." >&2
            exit 1
          fi

  android:
    name: Build signed Android APK
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Decrypt keystore
        env:
          ANDROID_KEYSTORE_DECRYPT_PASS: ${{ secrets.ANDROID_KEYSTORE_DECRYPT_PASS }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -in android/release.keystore.enc -out android/release.keystore -k "$ANDROID_KEYSTORE_DECRYPT_PASS"
      - name: Write Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON is unset; building without Firebase push."
          fi
      - name: Build Android release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleRelease
      - name: Stage versioned APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "HideMyEmail-${GITHUB_REF_NAME}.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-apk-${{ github.run_id }}-android
          path: HideMyEmail-${{ github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  extension:
    name: Build Chromium extension
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install, test, and package extension
        working-directory: extension
        run: npm ci && npm test && npm run zip
      - name: Verify packaged extension boundaries
        run: |
          archive="extension/hidemyemail-extension.zip"
          test -f "$archive"
          mapfile -t entries < <(unzip -Z1 "$archive")
          printf '%s\n' "${entries[@]}" | grep -Eq '^manifest\.json$'
          printf '%s\n' "${entries[@]}" | grep -Eq '^popup\.html$'
          if printf '%s\n' "${entries[@]}" | grep -Eq '(^|/)(src|test|tests|node_modules)/|\.map$'; then
            echo "Extension archive contains development content." >&2
            exit 1
          fi
          unzip -p "$archive" manifest.json > packaged-manifest.json
          node - <<'NODE'
          const manifest = require('./packaged-manifest.json')
          const allowed = ['https://*/*', 'http://localhost/*', 'http://127.0.0.1/*', 'http://[::1]/*']
          if (manifest.manifest_version !== 3 || JSON.stringify(manifest.optional_host_permissions) !== JSON.stringify(allowed)) process.exit(1)
          if (manifest.content_scripts || manifest.web_accessible_resources || manifest.host_permissions) process.exit(1)
          NODE
          unzip -p "$archive" popup.html > packaged-popup.html
          node - <<'NODE'
          const fs = require('node:fs')
          const html = fs.readFileSync('packaged-popup.html', 'utf8')
          const executableURLs = [...html.matchAll(/<(?:script|link)\b[^>]*\b(?:src|href)=["']([^"']+)["']/gi)].map((match) => match[1])
          if (executableURLs.some((url) => /^(?:https?:)?\/\//i.test(url))) {
            console.error('Packaged popup references remote executable content.')
            process.exit(1)
          }
          NODE
          mv "$archive" "HideMyEmail-${GITHUB_REF_NAME}-chromium.zip"
      - name: Upload extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-extension-${{ github.run_id }}-chromium
          path: HideMyEmail-${{ github.ref_name }}-chromium.zip
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  testflight:
    name: Publish TestFlight build
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/testflight.yml
    secrets:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

  containers:
    name: Publish release containers
    needs: validate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  release:
    name: Publish GitHub release
    needs: [validate, android, extension, testflight, containers]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Revalidate immutable remote tag
        run: |
          remote_ref="refs/remotes/origin/release-tag"
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:$remote_ref"
          remote_tag_commit="$(git rev-parse "$remote_ref^{commit}")"
          if [ "$remote_tag_commit" != "$GITHUB_SHA" ]; then
            echo "Remote tag $GITHUB_REF_NAME moved from $GITHUB_SHA to $remote_tag_commit." >&2
            exit 1
          fi
      - name: Recreate curated release notes
        run: |
          node worker/scripts/validate-release.mjs \
            --tag="$GITHUB_REF_NAME" \
            --repository="$GITHUB_REPOSITORY" \
            --notes-output=release-notes.md
      - name: Download exact APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-apk-${{ github.run_id }}-android
          path: release-assets
      - name: Download exact extension artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-extension-${{ github.run_id }}-chromium
          path: release-assets
      - name: Publish release last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source_asset="release-assets/HideMyEmail-${GITHUB_REF_NAME}.apk"
          asset_name="HideMyEmail-${GITHUB_REF_NAME}.apk"
          asset="$source_asset"
          extension_source="release-assets/HideMyEmail-${GITHUB_REF_NAME}-chromium.zip"
          extension_name="HideMyEmail-${GITHUB_REF_NAME}-chromium.zip"
          extension_asset="$extension_source"
          test -f "$source_asset"
          test -f "$extension_source"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if ! gh release view "$GITHUB_REF_NAME" --json assets \
              --jq '.assets[].name' | grep -Fxq "$asset_name"; then
              gh release upload "$GITHUB_REF_NAME" "$asset"
            fi
            if ! gh release view "$GITHUB_REF_NAME" --json assets \
              --jq '.assets[].name' | grep -Fxq "$extension_name"; then
              gh release upload "$GITHUB_REF_NAME" "$extension_asset"
            fi

            mapfile -t obsolete_assets < <(
              gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
                grep -E '^HideMyEmail-v[^/]+\.apk$|^HideMyEmail-v[^/]+-[0-9a-f]+-(attempt|run)[0-9]+\.apk$' |
                grep -Fvx "$asset_name" || true
            )
            for obsolete_asset in "${obsolete_assets[@]}"; do
              gh release delete-asset "$GITHUB_REF_NAME" "$obsolete_asset" --yes
            done
            mapfile -t obsolete_extensions < <(
              gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
                grep -E '^HideMyEmail-v[^/]+-chromium\.zip$|^HideMyEmail-v[^/]+-[0-9a-f]+-(attempt|run)[0-9]+-chromium\.zip$' |
                grep -Fvx "$extension_name" || true
            )
            for obsolete_extension in "${obsolete_extensions[@]}"; do
              gh release delete-asset "$GITHUB_REF_NAME" "$obsolete_extension" --yes
            done

            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$asset" "$extension_asset" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi
