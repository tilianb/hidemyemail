name: Docs

# Builds the Astro Starlight site in website/ (content synced from docs/,
# README, CHANGELOG, ROADMAP) and publishes it to GitHub Pages.
# Enable once in repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    # Publish from main so the public site reflects released software.
    # Edits still flow through dev (per-page "Edit page" links target dev).
    branches: ["main"]
    paths:
      - "website/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
permissions: {}

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: namespace-profile-github-light
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@445c25d7009680597d73eb03c4e1cd5be522ed73 # v9

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Namespace npm cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (syncs docs, then astro build)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: namespace-profile-default
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
