# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"

reviews:
  # Keep feedback useful without turning style preferences into review noise.
  profile: "chill"
  request_changes_workflow: false

  # Post a compact PR walkthrough and inline findings, but no decorative output.
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: false
  collapse_walkthrough: true
  poem: false

  # website/src/content/docs is generated by website/scripts/sync-docs.mjs.
  path_filters:
    - "!website/src/content/docs/**"

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    # The default branch (main) is reviewed automatically. Feature work lands
    # on dev, so it must be included explicitly.
    base_branches:
      - "dev"

  path_instructions:
    - path: "worker/src/**"
      instructions: |
        Prioritize correctness and exploitable security issues over style.
        Pay particular attention to authentication boundaries, fresh-auth
        enforcement, encrypted destination handling, untrusted mail/webhook
        input, atomic one-time artifact consumption, and retry/concurrency
        safety around delivery claims and quota reservations.

    - path: "worker/migrations/**"
      instructions: |
        Migrations are append-only. Flag edits to existing migrations and
        schema changes that break existing rows or require application code to
        tolerate a partially migrated database.

    - path: "{android,ios}/**"
      instructions: |
        Check native bearer authentication and canonical server-origin binding
        carefully. When API behavior changes, verify that the Android and iOS
        clients remain in parity.

    - path: ".github/workflows/**"
      instructions: |
        Check least-privilege permissions, untrusted pull-request input,
        secret exposure, release gating, and whether third-party actions are
        pinned to immutable commit SHAs.

  # Keep CodeRabbit advisory-only. It may review and suggest changes, but it
  # must not generate code, commits, fixes, or pull requests.
  finishing_touches:
    autofix:
      enabled: false
    docstrings:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    simplify:
      enabled: false
    unit_tests:
      enabled: false

chat:
  # Avoid unsolicited conversation; explicitly mention @coderabbitai when a
  # response is wanted.
  auto_reply: false
  art: false
